# CI/CD for the Music and Memory Task.
#
# CI (every push and pull request):
#   1. Browser tests on desktop, laptop, iPad and phones: Chromium with each device's screen,
#      touch and user agent, plus the real WebKit (Safari) engine for iPhone, iPad and Mac.
#   2. Analysis pipeline on simulated data (simulate.py -> analyze.py).
#   3. Site bundle: only the files the site serves, smoke-tested, uploaded as an artifact.
# CD (pushes to main):
#   4. Deploy: GitHub Pages already publishes main by itself ("Deploy from a branch").
#      To publish only after the tests pass instead, set Settings > Pages > Source to
#      "GitHub Actions" and add the repository variable PAGES_DEPLOY = actions.
#   5. Live check: waits until GitHub Pages serves this commit, then runs the smoke tests
#      against the live site on desktop, iPad and phones. Nothing is ever uploaded (?nosave=1).
name: CI/CD

on:
  push:
    branches: [main, dev, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser-tests:
    name: Tests · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop and laptop
            projects: --project=desktop --project=laptop
            browser: chromium
          - name: iPad portrait and landscape
            projects: --project=ipad --project=ipad-landscape
            browser: chromium
          - name: Phones (Android and iPhone sizes)
            projects: --project=mobile-android --project=mobile-iphone
            browser: chromium
          - name: Safari engine (iPhone, iPad, Mac)
            projects: --project=webkit-iphone --project=webkit-ipad --project=webkit-desktop
            browser: webkit
            webkit: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test ${{ matrix.projects }}
        env:
          PW_WEBKIT: ${{ matrix.webkit }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14

  analysis:
    name: Analysis pipeline (simulated data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - run: python analysis/simulate.py fake_data --n 40 --music -0.30 --style 0.25 --tempo -0.15 --style-fam 0.20
      - run: python analysis/analyze.py fake_data --out fake_results
      - name: Check the expected sessions were kept and excluded
        run: |
          cat fake_results/summary.txt
          grep -q "Excluded test runs: 1 sessions" fake_results/summary.txt
          grep -q "dropped 1: \['sabandon'\]" fake_results/summary.txt
          grep -q "FINAL SAMPLE: 42 participants" fake_results/summary.txt

  site:
    name: Site bundle
    needs: [browser-tests, analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Collect the files the site serves
        run: |
          mkdir _site
          cp -r index.html test.html assets stimuli _site/
          touch _site/.nojekyll
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test the bundle on desktop, iPad and phone
        run: npx playwright test --grep @smoke --project=desktop --project=ipad --project=mobile-iphone
        env:
          SITE_ROOT: _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'actions' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    name: Live site check
    needs: [site, deploy]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.site.result == 'success' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIVE_URL: ${{ vars.LIVE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v5
      - name: Wait until GitHub Pages serves this commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsSL "${LIVE_URL}index.html?v=${GITHUB_SHA}-$i" | cmp -s - index.html; then
              echo "Live site serves this commit."; exit 0
            fi
            sleep 15
          done
          echo "::error::GitHub Pages did not serve this commit within 15 minutes (${LIVE_URL})"; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Smoke tests against the live site
        run: npx playwright test --grep @smoke --project=desktop --project=laptop --project=ipad --project=mobile-android --project=mobile-iphone --project=webkit-iphone --project=webkit-ipad
        env:
          BASE_URL: ${{ env.LIVE_URL }}
          PW_WEBKIT: "1"
