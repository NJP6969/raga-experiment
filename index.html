<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f8">
<title>Music and Memory Task</title>
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/theme.js"></script>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; min-height:100vh; }
  h1 { font-size:1.5rem; margin:0 0 .5rem; }
  h2 { font-size:1.2rem; margin:0 0 .5rem; }
  p { margin:.5rem 0 1rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; margin:14px 0 4px; font-weight:600; }
  input[type=text], input[type=number], select { width:100%; padding:10px; font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line-strong); border-radius:8px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  input[type=checkbox], input[type=radio] { accent-color:var(--accent); }
  button { font:inherit; padding:10px 20px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg); cursor:pointer; margin-top:16px; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .stage { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:280px; text-align:center; }
  .big { font-size:5rem; font-weight:700; letter-spacing:.02em; line-height:1.1; }
  .fix { font-size:4rem; color:var(--muted); line-height:1; }
  .cue { font-size:1.6rem; font-weight:600; }
  .scale { display:flex; gap:8px; margin:6px 0 4px; }
  .scale button { margin:0; flex:1; background:transparent; color:var(--fg); border-color:var(--line-strong); padding:8px 2px; display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.2; }
  .scale button span { font-size:.72rem; color:var(--muted); }
  .scale button.on span { color:var(--accent-fg); }
  .scale button.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .ends { display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); }
  .progress { margin-bottom:20px; }
  .progress-meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:6px; font-size:.85rem; color:var(--muted); }
  .progress-meta #progLabel { color:var(--fg); font-weight:600; }
  .bar { height:6px; background:var(--track); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); border-radius:3px; transition:width .3s; }
  .warn { background:var(--warn-bg); color:var(--warn-fg); border:1px solid var(--warn-line); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:.9rem; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; margin:12px 0; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .slots { display:flex; gap:min(8px, 1.5vw); justify-content:center; margin:12px 0; }
  .slots span { width:min(2.2rem, 8.5vw); height:3rem; border-bottom:3px solid var(--line-strong); font-size:min(2rem, 7vw); font-weight:700; display:flex; align-items:flex-end; justify-content:center; }
  .pad { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; width:100%; max-width:320px; margin:4px auto 0; }
  .pad button { margin:0; padding:14px 0; font-size:1.5rem; font-weight:700; background:var(--card); color:var(--fg); border-color:var(--line-strong); touch-action:manipulation; user-select:none; }
  .pad button { -webkit-tap-highlight-color:transparent; outline:none; }
  .pad button:active { background:var(--accent-soft); }
  .pad button.done { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-size:1.1rem; }
  .pad button.done:disabled { opacity:.35; }
  .slots span.cur { border-color:var(--accent); }
  .seq { font-size:1.6rem; font-weight:700; letter-spacing:.3em; }
  fieldset.choice { border:0; padding:0; margin:14px 0 0; min-width:0; }
  fieldset.choice legend { font-weight:600; padding:0; margin-bottom:6px; }
  .seg { display:flex; gap:8px; }
  .seg label { flex:1; margin:0; position:relative; }
  .seg input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
  .seg span { display:block; text-align:center; padding:10px; border:1px solid var(--line-strong); border-radius:8px; background:var(--card); }
  .seg input:checked + span { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  .opt { font-weight:400; color:var(--muted); font-size:.9rem; }
  .field-msg { margin:4px 0 0; font-size:.85rem; color:var(--muted); min-height:1.25em; }
  .field-msg.err { color:var(--bad); }
  .theme-opts { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin:12px 0 16px; }
  .theme-opts label { margin:0; position:relative; font-weight:400; }
  .theme-opts input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
  .opt-card { display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; padding:12px 8px; border:1px solid var(--line-strong); border-radius:10px; background:var(--card); text-align:center; }
  .opt-card b { font-weight:600; }
  .opt-card small { color:var(--muted); font-size:.78rem; line-height:1.3; }
  .theme-opts input:checked + .opt-card { border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); }
  .theme-opts input:focus-visible + .opt-card { outline:2px solid var(--accent); outline-offset:2px; }
  .sw { width:34px; height:34px; flex:none; border-radius:50%; border:1px solid var(--line-strong); }
  .sw-system { background:linear-gradient(90deg, #f5f6f8 50%, #121418 50%); }
  .sw-light { background:linear-gradient(135deg, #f5f6f8 55%, #3b55c9 55%); }
  .sw-dark { background:linear-gradient(135deg, #121418 55%, #8fa3ff 55%); }
  .preview { display:grid; grid-template-columns:auto 1fr; gap:12px 16px; align-items:center; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .preview-digit { font-size:3rem; font-weight:700; width:64px; text-align:center; line-height:1; }
  .preview-keys { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; max-width:220px; }
  .preview-keys span, .preview-scale span { padding:4px 0; text-align:center; font-weight:700; border:1px solid var(--line-strong); border-radius:6px; background:var(--card); }
  .preview-keys span.done, .preview-scale span.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .preview-keys span.done { grid-column:span 3; font-weight:600; }
  .preview-scale { grid-column:1 / -1; display:flex; gap:6px; }
  .preview-scale span { flex:1; }
  .preview-note { grid-column:1 / -1; margin:0; }
  @media (max-width:420px) {
    .theme-opts { grid-template-columns:1fr; }
    .opt-card { flex-direction:row; text-align:left; gap:12px; }
  }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div class="progress" id="progress" hidden>
    <div class="progress-meta"><span id="progLabel"></span><span id="progPct"></span></div>
    <div class="bar" role="progressbar" aria-labelledby="progLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="prog" style="width:0%"></div></div>
  </div>
  <div id="warn"></div>
  <div id="app"></div>
</main>

<script>
"use strict";
/* ---------- config ---------- */
const Q = new URLSearchParams(location.search);
const FAST = Q.has("fast");                 // ?fast=1 shortens lead-in and rest, for piloting
const SAVE = !Q.has("nosave");              // ?nosave=1 runs without uploading anything
const DATAPIPE_ID = "hmU1FxSIMrPB";         // DataPipe experiment; files land in its Google Drive folder
const LEAD_IN_S = FAST ? 3 : 30;
const REST_S = FAST ? 2 : 20;
const RECALL_LEN = 9, RECALL_LISTS = 8;     // serial recall: 8 lists of 9 digits per block (all of 1-9, random order)

const CONDITIONS = {
  A: { label: "Indian style, slow",  style: "raga",    tempo: "slow", file: "stimuli/A_raga_slow.mp3" },
  B: { label: "Indian style, fast",  style: "raga",    tempo: "fast", file: "stimuli/B_raga_fast.mp3" },
  C: { label: "Western style, slow", style: "western", tempo: "slow", file: "stimuli/C_western_slow.mp3" },
  D: { label: "Western style, fast", style: "western", tempo: "fast", file: "stimuli/D_western_fast.mp3" },
  E: { label: "Quiet",               style: "quiet",   tempo: "none", file: null }
};
// Williams design for 5 conditions: each condition appears in each position twice and directly
// follows every other condition twice across the 10 orders (balances first-order carry-over).
const ORDERS = ["ABECD", "BCADE", "CDBEA", "DECAB", "EADBC", "DCEBA", "EDACB", "AEBDC", "BACED", "CBDAE"];

/* ---------- state ---------- */
const app = document.getElementById("app");
const rows = [];            // trial-level data
const blockSummaries = [];
let P = {};                 // participant info
let audioOK = true, hiddenCount = 0, inBlock = false, chimeCtx = null;
const players = {};         // one preloaded <audio> per music condition
for (const [k, c] of Object.entries(CONDITIONS)) {
  if (!c.file) continue;
  const a = new Audio(); a.preload = "auto"; a.loop = true; a.src = c.file;
  a.addEventListener("error", () => { audioOK = false; warn("A music file could not be loaded. Check your connection and reload the page."); });
  players[k] = a;
}
let current = null;
document.addEventListener("visibilitychange", () => {
  if (document.hidden && inBlock) hiddenCount++;
  if (!document.hidden && inBlock) warn("Please stay on this tab until the block ends. Switching away is recorded and can make your answers unusable.");
});
const leaveGuard = e => { e.preventDefault(); e.returnValue = ""; };
function unlockAudio() {                     // must run inside a tap: lets iPhones play these elements later
  for (const a of Object.values(players)) {
    a.muted = true;
    const pr = a.play();
    if (pr) pr.then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
    else { a.pause(); a.muted = false; }
  }
  try { chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)(); chimeCtx.resume(); } catch (e) {}
}
let wakeLock = null;
async function keepAwake() {                 // stop phones dimming and locking during the listening periods
  try { if ("wakeLock" in navigator && !document.hidden) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && wakeLock !== null) keepAwake(); });

/* ---------- saved progress (survives reloads and closed tabs on this computer) ---------- */
const STATE_KEY = "raga_state_v1", STATE_MAX_AGE_H = 6;
const S = { nextBlock: 0, practiceDone: false, baselineDone: false, finished: false };
function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({ ...S, savedAt: Date.now(), fast: FAST, P, rows, blockSummaries }));
  } catch (e) {}
}
function loadState() {
  try {
    const st = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
    if (!st || !st.P || !st.P.session || st.fast !== FAST) return null;
    if ((Date.now() - st.savedAt) / 3.6e6 > STATE_MAX_AGE_H) { localStorage.removeItem(STATE_KEY); return null; }
    return st;
  } catch (e) { return null; }
}
function clearState() { try { localStorage.removeItem(STATE_KEY); } catch (e) {} }
function resumePrompt(st) {
  return new Promise(res => {
    const what = st.finished ? "You finished all five blocks, but your answers were not saved yet."
      : st.nextBlock > 0 ? `You completed ${st.nextBlock} of 5 blocks.` : "You started but did not finish the practice or the first block.";
    show(`<div class="card"><h1>Welcome back</h1>
      <p>This computer has an unfinished session (${st.P.name ? `<b>${esc(st.P.name)}</b>, ` : ""}ID <b>${esc(st.P.id)}</b>, started ${new Date(st.savedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}). ${what}</p>
      <p class="muted">${st.finished ? "" : "Continuing restarts the block you were in, from its beginning."}</p>
      <button id="cont">${st.finished ? "Save my answers" : "Continue my session"}</button>
      <button id="fresh" class="secondary">Start over</button></div>`, "resume", st);
    document.getElementById("cont").onclick = () => { unlockAudio(); keepAwake(); res(true); };
    document.getElementById("fresh").onclick = () => res(false);
  });
}

/* ---------- helpers ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => r())));
function warn(msg) { document.getElementById("warn").innerHTML = msg ? `<div class="warn">${msg}</div>` : ""; }
/* Progress bar: shown only on the first page of each phase, with how much of the whole session is done.
   The five blocks are most of the time, so they take 15-100%. Every other page hides the bar. */
const BLOCK_START = 0.15, BLOCK_SPAN = (1 - BLOCK_START) / 5;
const PHASES = {
  intro:    () => [0, "Intro"],
  setup:    () => [0.04, "Setup"],
  testing:  () => [0.07, "Practice"],
  pre:      () => [0.12, "Questions before the task"],
  about:    b => b == null ? [0.14, "About the task"] : [BLOCK_START + b * BLOCK_SPAN, `Block ${b + 1} of 5`],
  continue: b => [BLOCK_START + b * BLOCK_SPAN, "About the task"],
  post:     b => [BLOCK_START + (b + 0.85) * BLOCK_SPAN, `Questions after block ${b + 1}`],
  resume:   st => [savedProgress(st), "Welcome back"],
  done:     () => [1, "Finished"]
};
let progFloor = 0;                           // a resumed session never shows less than it had reached
function savedProgress(st) {
  return st.finished ? 1 : st.nextBlock > 0 ? BLOCK_START + st.nextBlock * BLOCK_SPAN
    : st.baselineDone ? PHASES.pre()[0] : st.practiceDone ? PHASES.testing()[0] : PHASES.setup()[0];
}
function setBar(phase, arg) {
  const box = document.getElementById("progress");
  if (!phase) { box.hidden = true; return; }
  const [f, label] = PHASES[phase](arg);
  const pct = Math.round(Math.max(f, progFloor) * 100);
  document.getElementById("progLabel").textContent = label;
  document.getElementById("progPct").textContent = `${pct}% done`;
  document.getElementById("prog").style.width = pct + "%";
  box.querySelector(".bar").setAttribute("aria-valuenow", pct);
  box.hidden = false;
}
function show(html, phase = null, arg = null) { app.innerHTML = html; setBar(phase, arg); }
function screen(html, btn = "Continue", phase = null, arg = null) {
  return new Promise(res => {
    show(`<div class="card">${html}<button id="go">${btn}</button></div>`, phase, arg);
    const go = document.getElementById("go"); go.focus();
    go.onclick = () => { go.disabled = true; res(); };
  });
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffle(a, rng) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ROLL_LEN = 10;                                          // roll numbers are exactly 10 digits
const validRoll = v => new RegExp(`^\\d{${ROLL_LEN}}$`).test(v);
const cleanName = v => v.trim().replace(/\s+/g, " ");
const validName = v => /^[\p{L}\p{M}][\p{L}\p{M} .'-]*$/u.test(v) && (v.match(/\p{L}/gu) || []).length >= 2;
function mean(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN; }
function fmt(x, d = 0) { return Number.isFinite(x) ? x.toFixed(d) : "–"; }

function log(r) {
  rows.push({ participant: P.id, session_id: P.session, music_course: P.musicCourse, full_name: P.name, device: P.device, theme: Theme.get(), theme_resolved: Theme.resolved(), test_run: FAST ? 1 : 0, order_row: P.row + 1, order: P.order.join(""), order_source: P.orderSource, resumes: P.resumes, fam_carnatic: P.famC, fam_hindustani: P.famH, training_years: P.training,
              audio_ok: audioOK, timestamp: new Date().toISOString(), ...r });
}

function startMusic(key) {
  stopMusic();
  const a = players[key]; if (!a) return;
  current = a; a.currentTime = 0;
  a.play().catch(e => {
    if (e.name === "AbortError") return;      // pause() arrived before play() finished: not a failure
    audioOK = false; warn("Music could not start. Check that the tab is not muted and your volume is up.");
  });
}
function stopMusic() { if (current) { current.pause(); current = null; } }
function waitAudio(key, maxMs = 30000) {       // resolves when the track can play through (or after maxMs)
  const a = players[key];
  if (!a || a.readyState >= 4) return Promise.resolve(true);
  return new Promise(res => {
    const done = ok => { a.removeEventListener("canplaythrough", onOk); clearTimeout(t); res(ok); };
    const onOk = () => done(true);
    a.addEventListener("canplaythrough", onOk);
    const t = setTimeout(() => done(false), maxMs);
    a.load();
  });
}

/* ---------- setup ---------- */
async function assignOrder() {             // next order in rotation from DataPipe; random if unavailable
  if (SAVE && !FAST) {
    try {
      const res = await fetch("https://pipe.jspsych.org/api/condition/", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "*/*" },
        body: JSON.stringify({ experimentID: DATAPIPE_ID }) });
      if (res.ok) {
        const d = await res.json();
        const c = typeof d === "number" ? d : d.condition;
        if (Number.isInteger(c)) { orderSource = "datapipe"; return c % ORDERS.length; }
      }
    } catch (e) {}
  }
  orderSource = "random";
  return Math.floor(Math.random() * ORDERS.length);
}
let orderSource = "url";
async function setup() {
  show(`<div class="card">
    <h1>Music and Memory Task</h1>
    <p>About 18 minutes. You will do one short memory task five times, with different background music (or silence) each time. Works on a phone, tablet or laptop. Use headphones, sit somewhere quiet, and keep this page open and in front until the end.</p>
    <p class="muted">Participation is voluntary and confidential. Your name and roll number are used only to record course participation and to link your sessions (for example if you need to continue later); they are removed before the data are analysed or shared. You can stop at any time by closing the page.</p>
    <fieldset class="choice" id="courseQ">
      <legend>Are you part of the Music Course?</legend>
      <div class="seg">
        <label><input type="radio" name="course" value="yes"><span>Yes</span></label>
        <label><input type="radio" name="course" value="no"><span>No</span></label>
      </div>
    </fieldset>
    <div id="nameRow" hidden>
      <label for="pname">Full name</label>
      <input id="pname" type="text" autocomplete="name" autocapitalize="words" spellcheck="false" maxlength="80" aria-describedby="nameMsg">
      <p class="field-msg" id="nameMsg" aria-live="polite"></p>
    </div>
    <div id="rollRow" hidden>
      <label for="pid">Roll number <span class="opt" id="rollOpt">(optional)</span></label>
      <input id="pid" type="text" inputmode="numeric" autocomplete="off" placeholder="10 digits, e.g. 2023102029" aria-describedby="pidMsg">
      <p class="field-msg" id="pidMsg" aria-live="polite"></p>
    </div>
    <label for="famC">How familiar are you with Carnatic (South Indian classical) music?</label>
    <select id="famC"><option value="" selected disabled>choose 1–5</option><option value="1">1 – not at all</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 – very familiar</option></select>
    <label for="famH">How familiar are you with Hindustani (North Indian classical) music?</label>
    <select id="famH"><option value="" selected disabled>choose 1–5</option><option value="1">1 – not at all</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5 – very familiar</option></select>
    <label for="trn">Years of formal music training (0 if none)</label>
    <input id="trn" type="number" min="0" max="60" value="0">
    <label><input id="hear" type="checkbox" style="margin-right:8px">I have normal or corrected hearing and I am wearing headphones.</label>
    <button id="start" disabled>Begin</button>
  </div>`, "intro");
  const $ = id => document.getElementById(id);
  const hear = $("hear"), start = $("start"), pid = $("pid"), pname = $("pname");
  const courseVal = () => (document.querySelector('input[name="course"]:checked') || {}).value;
  const touched = { pid: false, pname: false };
  const ready = () => {
    const c = courseVal(), member = c === "yes";
    $("nameRow").hidden = !member; $("rollRow").hidden = !c;
    $("rollOpt").textContent = member ? "" : "(optional)";
    const roll = pid.value, name = cleanName(pname.value);
    const rollOk = roll === "" ? !member : validRoll(roll), nameOk = !member || validName(name);
    // roll number: count while typing, error once the field is left (or when it is required and empty)
    const rollErr = !rollOk && touched.pid;
    $("pidMsg").textContent = rollErr ? (roll === "" ? `Enter your ${ROLL_LEN}-digit roll number.` : `Roll number must be exactly ${ROLL_LEN} digits.`)
      : roll && roll.length < ROLL_LEN ? `${roll.length} of ${ROLL_LEN} digits` : "";
    $("pidMsg").classList.toggle("err", rollErr);
    const nameErr = !nameOk && touched.pname;
    $("nameMsg").textContent = nameErr ? "Enter your full name (letters only)." : "";
    $("nameMsg").classList.toggle("err", nameErr);
    start.disabled = !(c && rollOk && nameOk && hear.checked && $("famC").value && $("famH").value);
  };
  pid.oninput = () => { pid.value = pid.value.replace(/\D/g, "").slice(0, ROLL_LEN); if (pid.value.length === ROLL_LEN) touched.pid = true; ready(); };
  pid.onblur = () => { touched.pid = pid.value !== "" || courseVal() === "yes"; ready(); };
  pname.oninput = ready; pname.onblur = () => { touched.pname = true; ready(); };
  document.querySelectorAll('input[name="course"]').forEach(r => r.onchange = () => { touched.pid = touched.pid && pid.value !== ""; ready(); });
  hear.onchange = ready; $("famC").onchange = ready; $("famH").onchange = ready;
  await new Promise(res => start.onclick = () => { unlockAudio(); res(); });
  const member = courseVal() === "yes";
  const session = Math.random().toString(36).slice(2, 10);   // unique even if two students type the same ID
  const id = pid.value || `anon-${session}`;                  // no roll number: a unique anonymous ID
  P = { id, musicCourse: member ? 1 : 0, name: member ? cleanName(pname.value) : "",
        famC: +$("famC").value, famH: +$("famH").value,
        training: Math.max(0, +$("trn").value || 0),
        row: Q.has("row") ? (+Q.get("row") - 1) % ORDERS.length : await assignOrder() };
  P.order = ORDERS[P.row].split("");
  P.orderSource = orderSource; P.resumes = 0;
  P.session = session;
  P.seed = hash(id + P.session);
  P.device = matchMedia("(pointer: coarse)").matches ? "touch" : "computer";
  keepAwake();
  window.addEventListener("beforeunload", leaveGuard);
  for (const a of Object.values(players)) a.load();          // start downloading every track now
}

/* ---------- setup: theme (System until the participant picks Light or Dark) ---------- */
Theme.onChange(() => { const el = document.getElementById("sysNow"); if (el) el.textContent = Theme.resolved("system"); });
async function themePage() {
  const opt = (v, name, desc) => `<label><input type="radio" name="theme" value="${v}"${Theme.get() === v ? " checked" : ""}>
    <span class="opt-card"><span class="sw sw-${v}"></span><span><b>${name}</b><br><small>${desc}</small></span></span></label>`;
  show(`<div class="card"><h2>Choose a theme</h2>
    <p>Pick how the task looks. It changes straight away, so try each one and check the preview. <b>System</b> follows your device's setting.</p>
    <div class="theme-opts" role="radiogroup" aria-label="Theme">
      ${opt("system", "System", `Follows this device (now <span id="sysNow">${Theme.resolved("system")}</span>)`)}
      ${opt("light", "Light", "Dark text on a light background")}
      ${opt("dark", "Dark", "Light text on a dark background")}
    </div>
    <div class="preview" role="img" aria-label="Preview of the task screens in this theme">
      <div class="preview-digit">7</div>
      <div class="preview-keys"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span class="done">Done</span></div>
      <div class="preview-scale"><span>1</span><span>2</span><span>3</span><span class="on">4</span><span>5</span></div>
      <p class="muted preview-note">Numbers, the keypad and the rating buttons will look like this.</p>
    </div>
    <button id="go">Continue</button></div>`, "setup");
  document.querySelectorAll('input[name="theme"]').forEach(r => r.onchange = () => Theme.set(r.value));
  const go = document.getElementById("go"); go.focus();
  await new Promise(res => go.onclick = () => { go.disabled = true; res(); });
}

async function volumeCheck() {
  show(`<div class="card"><h2>Set your volume</h2><p id="vtxt">Loading a music sample…</p>
    <button id="ok" disabled>Volume is comfortable</button></div>`);
  await waitAudio("A");
  document.getElementById("vtxt").textContent = "A sample is playing. Adjust your volume until it is comfortable, then leave it there for the whole task.";
  startMusic("A");
  const ok = document.getElementById("ok"); ok.disabled = false; ok.focus();
  await new Promise(res => ok.onclick = res);
  stopMusic();
}

/* ---------- serial recall (8 digits, forward order) ---------- */
function makeList(rng) {
  for (;;) {                                                 // the digits 1-9 in random order, no runs like 3-4-5 or 7-6-5
    const d = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9], rng).slice(0, RECALL_LEN);
    const run = d.some((x, i) => i > 1 && x - d[i - 1] === d[i - 1] - d[i - 2] && Math.abs(x - d[i - 1]) === 1);
    if (!run) return d;
  }
}
async function presentDigits(d, label) {
  show(`<div class="stage"><div class="fix">+</div><p class="muted">${label}</p></div>`); await sleep(700);
  for (const x of d) {
    show(`<div class="stage"><div class="big">${x}</div></div>`); await sleep(750);
    show(`<div class="stage"></div>`); await sleep(250);
  }
}
function recallInput(label) {
  return new Promise(res => {
    show(`<div class="stage">
      <p class="muted" style="margin:0">${label}</p>
      <p style="margin:.4rem 0">Enter the ${RECALL_LEN} digits <b>in the order they appeared</b>.<br><span class="muted">Use <b>–</b> for any you don't remember. Tap the keys or type on a keyboard.</span></p>
      <div class="slots" id="slots">${Array(RECALL_LEN).fill("<span></span>").join("")}</div>
      <div class="pad" id="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}
        <button data-k="-" aria-label="forgot this digit">–</button><button data-k="back" aria-label="delete">⌫</button><button data-k="done" class="done" disabled>Done</button></div>
      <p class="muted" id="hint">Done (or Enter) when all ${RECALL_LEN} are filled.</p></div>`);
    const slots = [...document.getElementById("slots").children], doneBtn = document.querySelector('#pad [data-k="done"]');
    const t0 = performance.now();
    let v = "", used = new Set();
    const render = () => {
      slots.forEach((sl, i) => { sl.textContent = v[i] === "-" ? "–" : (v[i] || ""); sl.classList.toggle("cur", i === v.length); });
      doneBtn.disabled = v.length !== RECALL_LEN;
    };
    const press = (k, via) => {
      used.add(via);
      if (k === "back") v = v.slice(0, -1);
      else if (k === "done") {
        if (v.length === RECALL_LEN) { document.removeEventListener("keydown", onKey); res({ v, rt: performance.now() - t0, input: [...used].sort().join("+") }); return; }
        document.getElementById("hint").innerHTML = `<b>Fill all ${RECALL_LEN} positions</b> (use – for ones you don't remember).`;
      } else if (v.length < RECALL_LEN) v += k;
      render();
    };
    const onKey = e => {
      const k = e.key === "Enter" ? "done" : e.key === "Backspace" ? "back" : /^[1-9-]$/.test(e.key) ? e.key : null;
      if (!k) return;
      e.preventDefault(); if (!e.repeat || k === "back") press(k, "keyboard");
    };
    document.addEventListener("keydown", onKey);
    document.getElementById("pad").onclick = e => { const b = e.target.closest("button"); if (b) press(b.dataset.k, "keypad"); };
    render();
  });
}
async function runRecall(rng, ctx, feedback = false, n = RECALL_LISTS) {
  let correctPos = 0, perfect = 0;
  for (let i = 0; i < n; i++) {
    const d = makeList(rng);
    const label = feedback ? `Practice list ${i + 1} of ${n}` : `List ${i + 1} of ${n}`;
    await presentDigits(d, label);
    const r = await recallInput(label);
    const hits = d.reduce((s, x, k) => s + (r.v[k] === String(x) ? 1 : 0), 0);
    correctPos += hits; perfect += hits === RECALL_LEN ? 1 : 0;
    if (feedback) {
      show(`<div class="stage"><p>The list was</p><div class="seq">${d.join("")}</div>
        <p class="cue ${hits >= 7 ? "ok" : ""}" style="margin-top:16px">${hits} of ${RECALL_LEN} in the right place</p></div>`);
      await sleep(2200);
    } else {
      log({ ...ctx, task: "recall", trial: i + 1, list_length: RECALL_LEN, stimulus: d.join(""), response: r.v,
            n_correct_positions: hits, correct: hits === RECALL_LEN ? 1 : 0, rt_ms: r.rt.toFixed(0), tab_hidden_so_far: hiddenCount, input: r.input });
      show(`<div class="stage"></div>`); await sleep(400);
    }
  }
  return { prop: correctPos / (n * RECALL_LEN), perfect };
}

/* ---------- ratings, rest, cues ---------- */
const SCALES = {
  alertness: ["During this block, how alert did you feel?", ["Very sleepy", "Somewhat sleepy", "Neither", "Somewhat alert", "Very alert"]],
  mood:      ["During this block, how was your mood?",       ["Very bad", "Bad", "Neutral", "Good", "Very good"]],
  indian:    ["How Indian did the music sound?",             ["Not at all", "Slightly", "Moderately", "Quite", "Very Indian"]]
};
function ratings(cond, baseline = false, pos = null) {
  return new Promise(res => {
    const keys = baseline ? ["alertness", "mood"] : ["alertness", "mood"].concat(CONDITIONS[cond].file ? ["indian"] : []);
    const q = k => baseline ? SCALES[k][0].replace("During this block, how", "Right now, how").replace("did you feel", "do you feel").replace("was your mood", "is your mood") : SCALES[k][0];
    const vals = {};
    show(`<div class="card"><h2>${baseline ? "Before you start" : "Quick ratings"}</h2>
      ${baseline ? `<p class="muted">Two quick questions about how you feel right now.</p>` : `<p class="muted">The first two are about <b>you</b> during the block${keys.includes("indian") ? "; the last is about <b>the music</b>" : ""}.</p>`}
      ${keys.map(k => `<label>${q(k)}</label><div class="scale" data-k="${k}">${SCALES[k][1].map((t, i) =>
        `<button data-v="${i + 1}"><b>${i + 1}</b><span>${t}</span></button>`).join("")}</div>`).join("")}
      <button id="next" disabled>Continue</button></div>`, baseline ? "pre" : "post", pos);
    const next = document.getElementById("next");
    document.querySelectorAll(".scale").forEach(sc => sc.querySelectorAll("button").forEach(b => b.onclick = () => {
      sc.querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
      vals[sc.dataset.k] = +b.dataset.v; next.disabled = Object.keys(vals).length < keys.length;
    }));
    next.onclick = () => { next.disabled = true; res(vals); };
  });
}
function chime() {                          // soft two-note chime; the page already had a click, so audio is allowed
  try {
    chimeCtx = chimeCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = chimeCtx.currentTime;
    [[880, 0], [660, 0.18]].forEach(([f, dt]) => {
      const o = chimeCtx.createOscillator(), g = chimeCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + dt); g.gain.linearRampToValueAtTime(0.18, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.9);
      o.connect(g).connect(chimeCtx.destination); o.start(t + dt); o.stop(t + dt + 1);
    });
  } catch (e) {}
}
async function rest(seconds) {
  for (let sec = seconds; sec > 0; sec--) {
    show(`<div class="stage"><p>Short rest. Close your eyes if you like; a chime will tell you when it is over.</p><div class="big" style="font-size:3rem">${sec}</div></div>`);
    await sleep(1000);
  }
  chime();
}
async function cue(html, ms = 2500) {
  show(`<div class="stage">${html}</div>`); await sleep(ms);
}

/* ---------- block ---------- */
async function runBlock(pos, key) {
  const c = CONDITIONS[key];
  const rng = mulberry32(P.seed + pos * 7919);
  const ctx = { block_position: pos + 1, condition: key, style: c.style, tempo: c.tempo };
  show(`<div class="card"><h2>Block ${pos + 1} of 5</h2>
    <p>${c.file ? "Music will start. For the first 30 seconds, just listen. Then the number lists begin <b>while the music keeps playing</b>." : "This block is <b>quiet</b>. For the first 30 seconds, just sit still. Then the number lists begin."}</p>
    <p class="muted">Keep your eyes on the screen and don't change the volume.</p>
    <p class="muted" id="load"></p>
    <button id="go" disabled>Start block</button></div>`, "about", pos);
  if (c.file && players[key].readyState < 4) document.getElementById("load").textContent = "Loading music…";
  const ok = await waitAudio(key);
  document.getElementById("load").textContent = ok ? "" : "The music is taking long to load; it will start as soon as it can.";
  const go = document.getElementById("go"); go.disabled = false; go.focus();
  await new Promise(res => go.onclick = () => { go.disabled = true; res(); });
  hiddenCount = 0; inBlock = true; warn("");
  startMusic(key);
  for (let s = LEAD_IN_S; s > 0; s--) {
    show(`<div class="stage"><div class="fix">+</div><p class="muted">${c.file ? "Just listen" : "Sit quietly"} · ${s}s</p></div>`);
    await sleep(1000);
  }
  await cue(`<div class="cue">Numbers</div><p class="muted">Remember the order. Type them back in the same order.</p>`);
  const rc = await runRecall(rng, ctx);
  stopMusic(); inBlock = false; warn("");
  const rat = await ratings(key, false, pos);
  for (const [k, v] of Object.entries(rat)) log({ ...ctx, task: "rating", stimulus: k, response: v });
  blockSummaries.push({
    participant: P.id, session_id: P.session, music_course: P.musicCourse, full_name: P.name, test_run: FAST ? 1 : 0, block_position: pos + 1, condition: key, label: c.label, style: c.style, tempo: c.tempo,
    order: P.order.join(""), recall_prop_correct: rc.prop, recall_lists_perfect: rc.perfect,
    alertness: rat.alertness, mood: rat.mood, indian: rat.indian ?? "",
    tab_hidden_count: hiddenCount, audio_ok: audioOK, resumes: P.resumes, theme: Theme.get()
  });
  if (pos < 4) await rest(REST_S);
}

/* ---------- export ---------- */
function toCSV(arr) {
  if (!arr.length) return "";
  const cols = [...new Set(arr.flatMap(Object.keys))];
  const esc = v => { v = v === undefined || v === null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return [cols.join(","), ...arr.map(r => cols.map(c => esc(r[c])).join(","))].join("\n");
}
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" })); a.download = name; a.click();
}
async function upload(filename, text) {
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch("https://pipe.jspsych.org/api/data/", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "*/*" },
        body: JSON.stringify({ experimentID: DATAPIPE_ID, filename, data: text })
      });
      if (res.ok) return { ok: true };
      const body = await res.json().catch(() => ({}));
      if (res.status < 500) return { ok: false, error: body.message || `HTTP ${res.status}` };   // retrying will not help
    } catch (e) {
      if (attempt === 2) return { ok: false, error: e.message };
    }
    await sleep(1500 * (attempt + 1));
  }
  return { ok: false, error: "server unavailable" };
}

function fileBase() {
  return `${FAST ? "TEST_" : ""}${String(P.id).replace(/[^A-Za-z0-9-]/g, "") || "anon"}_${P.session}`;
}
function uploadProgress(blocksDone) {         // cumulative trials so far; fire-and-forget, never blocks the participant
  if (!SAVE) return;
  upload(`${fileBase()}_progress_b${blocksDone}${P.resumes ? "_r" + P.resumes : ""}.csv`, toCSV(rows)).catch(() => {});
}

async function finish() {
  const sorted = [...blockSummaries].sort((a, b) => a.condition.localeCompare(b.condition));
  const base = fileBase();
  const files = [[`${base}_trials.csv`, toCSV(rows)], [`${base}_blocks.csv`, toCSV(blockSummaries)]];
  show(`<div class="card"><h1>Done, thank you</h1>
    <p id="saveStatus"><b>Saving your responses…</b> Please keep this tab open.</p>
    <div id="saveActions"></div>
    <h2 style="margin-top:24px">Your results</h2>
    <table><tr><th>Condition</th><th>Numbers recalled</th><th>Alert</th><th>Mood</th><th>Indian</th></tr>
    ${sorted.map(b => `<tr><td>${b.label}</td><td>${fmt(b.recall_prop_correct * 100)}%</td><td>${b.alertness}</td><td>${b.mood}</td><td>${b.indian || "–"}</td></tr>`).join("")}</table>
    <p class="muted">One person's numbers are noisy and do not show an effect on their own. The class data are what count.</p></div>`, "done");
  const status = document.getElementById("saveStatus"), actions = document.getElementById("saveActions");
  const downloads = `<button id="d1" class="secondary">Download trial data</button> <button id="d2" class="secondary">Download block summary</button>`;
  const wireDownloads = () => {
    document.getElementById("d1").onclick = () => download(files[0][0], files[0][1]);
    document.getElementById("d2").onclick = () => download(files[1][0], files[1][1]);
  };
  if (!SAVE) {
    window.removeEventListener("beforeunload", leaveGuard); clearState();
    status.innerHTML = "<b>Test mode:</b> nothing was uploaded.";
    actions.innerHTML = downloads; wireDownloads(); return;
  }
  const pending = files.map(() => true);
  const attempt = async () => {
    status.innerHTML = "<b>Saving your responses…</b> Please keep this tab open."; actions.innerHTML = "";
    let err = "";
    for (let i = 0; i < files.length; i++) {
      if (!pending[i]) continue;
      const r = await upload(files[i][0], files[i][1]);
      if (r.ok) pending[i] = false; else err = r.error;
    }
    if (!pending.some(Boolean)) {
      window.removeEventListener("beforeunload", leaveGuard); clearState();
      status.innerHTML = "<b>Your responses are saved.</b> You can close this tab.";
      actions.innerHTML = `<p class="muted">Optional: keep a copy.</p>` + downloads; wireDownloads();
    } else {
      status.innerHTML = `<b>Your responses could not be saved</b> (${err}). Try again; if it still fails, download both files and send them to your instructor.`;
      actions.innerHTML = `<button id="retry">Try again</button> ` + downloads; wireDownloads();
      document.getElementById("retry").onclick = attempt;
    }
  };
  await attempt();
}

async function runBaseline() {               // one "right now" alertness/mood rating before the first block
  if (S.baselineDone) return;
  const base = await ratings("E", true);
  for (const [k, v] of Object.entries(base)) log({ block_position: 0, condition: "baseline", style: "none", tempo: "none", task: "rating", stimulus: k, response: v });
  S.baselineDone = true; saveState();
}

/* ---------- main ---------- */
(async function main() {
  const saved = loadState();
  if (saved && await resumePrompt(saved)) {
    Object.assign(P, saved.P); P.resumes = (P.resumes || 0) + 1;
    rows.push(...saved.rows); blockSummaries.push(...saved.blockSummaries);
    Object.assign(S, { nextBlock: saved.nextBlock, practiceDone: saved.practiceDone, baselineDone: !!saved.baselineDone, finished: saved.finished });
    window.addEventListener("beforeunload", leaveGuard);
    for (const a of Object.values(players)) a.load();
    progFloor = savedProgress(S);
    if (S.finished) { await finish(); return; }
  } else {
    clearState();
    await setup();
  }
  saveState();
  await themePage();
  await volumeCheck();
  if (!S.practiceDone) {
    await screen(`<h2>The task: number lists</h2>
      <p>${RECALL_LEN} digits appear one at a time. Then type them back <b>in the same order</b>.</p>
      <p>Each list uses all the digits 1–9 once, in a random order. Example: you see 4, 9, 2, … → you enter 4 9 2 …. If you forget one, enter <b>–</b> in its place so the others stay in the right position. Tap the on-screen keys, or type on a keyboard.</p>
      <p class="muted">There is no time limit for typing; the music simply keeps playing until you finish. It is meant to be hard; most people get about half to two-thirds right. Two practice lists first, without music.</p>`, "Try the practice lists", "testing");
    await runRecall(mulberry32(1), {}, true, 2);
    S.practiceDone = true; saveState();
    await runBaseline();
    await screen(`<h2>Ready</h2><p>Five blocks follow, about 3 minutes each, each with different background music or silence. Each block starts with 30 seconds of just listening, then ${RECALL_LISTS} number lists (the screen shows "List 1 of ${RECALL_LISTS}" and so on). No time limit: the music keeps playing until you finish the last list.</p>
      <p class="muted">Don't change your volume, and keep this tab in front until the end. If the page closes by accident, open the link again on this computer to continue.</p>`, "Start", "about");
  } else {
    await runBaseline();
    await screen(`<h2>Continuing</h2><p>Next is block ${S.nextBlock + 1} of 5. As before: 30 seconds of listening, then ${RECALL_LISTS} number lists, typed back in the same order.</p>`, "Continue", "continue", S.nextBlock);
  }
  for (let i = S.nextBlock; i < 5; i++) {
    await runBlock(i, P.order[i]);
    S.nextBlock = i + 1; saveState(); uploadProgress(i + 1);
  }
  S.finished = true; saveState();
  await finish();
})();
</script>
